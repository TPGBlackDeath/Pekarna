<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naročilo | Pekarna Pri Peku</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="button header-start" href="index.html">Nazaj</a>
        <h1>NAROCILO</h1>
    </header>

    <main class="page">
        <section class="panel">
            <h2>Naroci</h2>
            <form id="order-form" novalidate>
                <div class="fields">
                    <div class="field field--half">
                        <label class="visually-hidden" for="ime">Ime</label>
                        <input id="ime" name="ime" type="text" placeholder="Ime" autocomplete="given-name" required aria-describedby="ime-error">
                        <p class="error" id="ime-error"></p>
                    </div>
                    <div class="field field--half">
                        <label class="visually-hidden" for="priimek">Priimek</label>
                        <input id="priimek" name="priimek" type="text" placeholder="Priimek" autocomplete="family-name" required aria-describedby="priimek-error">
                        <p class="error" id="priimek-error"></p>
                    </div>
                    <div class="field">
                        <label class="visually-hidden" for="email">E-mail</label>
                        <input id="email" name="email" type="email" placeholder="E-mail" autocomplete="email" required aria-describedby="email-error">
                        <p class="error" id="email-error"></p>
                    </div>
                    <div class="field">
                        <label class="visually-hidden" for="izdelek">Izdelek</label>
                        <textarea id="izdelek" name="izdelek" placeholder="Izdelek" required aria-describedby="izdelek-error"></textarea>
                        <p class="error" id="izdelek-error"></p>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="button" type="submit">NAROČI</button>
                </div>
                <p class="form-status" id="form-status" role="status" hidden></p>
            </form>
        </section>
    </main>
</body>
</html>
